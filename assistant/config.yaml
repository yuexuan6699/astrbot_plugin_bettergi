# ============================================================
# BetterGI 远程辅助程序配置（客户端模式）
# ============================================================
# 辅助程序主动连接到 AstrBot，无需开放任何端口。
# 只需填写 AstrBot 的访问地址即可。

# AstrBot 的访问地址（必填）
# 辅助程序会连接到这个地址的 SSE 端点等待指令
# 例如: http://192.168.1.100:6185
astrbot_url: "http://127.0.0.1:6185"

# BetterGI 安装目录（必填）
bettergi_dir: "D:\\BetterGI"

# 认证令牌（可选，与插件配置保持一致）
token: "your-secret-token"

# 日志级别: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"
